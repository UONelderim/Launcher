name: Build & Release

on:
  push:
    branches: "master"
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: "*"
    paths-ignore:
      - '**/README.md'
  

env:
  DOTNET_NOLOGO: false
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish NelderimLauncher -c Release -o release -r ${{ matrix.rid }} -p:DebugType=None \
        -p:WarningLevel=0 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true \
        -p:IncludeAllContentForSelfExtract=true -p:PublishTrimmed=true 
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NelderimLauncher-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ github.workspace }}/release/NelderimLauncher.exe 
            ${{ github.workspace }}/release/NelderimLauncher